<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Wedding Counter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: #1c0a10 url('photo.png.png') no-repeat center center fixed;
            background-size: cover;

            color: #dfba6b;
            font-family: Georgia, serif;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        /* DARK CINEMATIC OVERLAY */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(80, 20, 35, 0.25),
                    rgba(10, 3, 7, 0.82)
                );

            z-index: 1;
            pointer-events: none;
        }

        /* SOFT GOLD GLOW */
        body::after {
            content: "";
            position: fixed;
            inset: 0;

            box-shadow:
                inset 0 0 150px rgba(0, 0, 0, 0.9);

            z-index: 1;
            pointer-events: none;
        }

        /* MAIN CARD */
        .clock-container {
            position: relative;
            z-index: 5;

            width: min(900px, 90%);

            padding: 50px 45px;

            text-align: center;

            border: 1px solid rgba(223, 186, 107, 0.9);
            border-radius: 28px;

            background: rgba(35, 8, 18, 0.72);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            box-shadow:
                0 0 20px rgba(223, 186, 107, 0.15),
                0 0 60px rgba(223, 186, 107, 0.12),
                inset 0 0 30px rgba(223, 186, 107, 0.05);

            animation: cardGlow 4s ease-in-out infinite alternate;

            display: none;
        }

        @keyframes cardGlow {
            from {
                box-shadow:
                    0 0 20px rgba(223, 186, 107, 0.15),
                    0 0 60px rgba(223, 186, 107, 0.08);
            }

            to {
                box-shadow:
                    0 0 30px rgba(223, 186, 107, 0.3),
                    0 0 80px rgba(223, 186, 107, 0.15);
            }
        }

        /* TOP DECORATION */
        .decoration {
            font-size: 28px;
            color: #dfba6b;
            letter-spacing: 12px;
            margin-bottom: 15px;

            animation: floatingHeart 3s ease-in-out infinite;
        }

        @keyframes floatingHeart {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        /* TITLE */
        h1 {
            margin: 0;

            font-size: clamp(27px, 5vw, 48px);

            font-weight: normal;
            letter-spacing: 3px;

            color: white;

            text-shadow:
                0 0 10px rgba(255,255,255,0.2),
                0 0 25px rgba(223,186,107,0.25);
        }

        /* SUBTITLE */
        .sub-title {
            margin-top: 15px;
            margin-bottom: 35px;

            font-size: clamp(14px, 2vw, 18px);

            color: #dfba6b;

            font-style: italic;
            letter-spacing: 2px;
        }

        /* GOLD DIVIDER */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 15px;

            margin: 25px 0;
        }

        .divider span {
            height: 1px;

            width: 120px;

            background: linear-gradient(
                to right,
                transparent,
                #dfba6b,
                transparent
            );
        }

        .divider .heart {
            font-size: 20px;
            animation: heartPulse 1.8s infinite;
        }

        @keyframes heartPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }
        }

        /* CLOCK */
        #clock {
            display: flex;
            justify-content: center;
            gap: 15px;

            margin-top: 30px;
        }

        .time-box {
            min-width: 130px;

            padding: 20px 10px;

            border-left: 1px solid rgba(223,186,107,0.4);

            background: rgba(255,255,255,0.025);
        }

        .time-box:first-child {
            border-left: none;
        }

        .number {
            display: block;

            color: white;

            font-size: clamp(28px, 5vw, 48px);

            font-weight: bold;

            text-shadow:
                0 0 12px rgba(255,255,255,0.25);
        }

        .label {
            display: block;

            margin-top: 7px;

            color: #dfba6b;

            font-size: 14px;

            font-style: italic;
            letter-spacing: 2px;
        }

        /* BOTTOM MESSAGE */
        .message {
            margin-top: 35px;

            color: #e9c982;

            font-size: clamp(16px, 2.5vw, 22px);

            font-style: italic;

            letter-spacing: 1px;

            text-shadow:
                0 0 10px rgba(223,186,107,0.3);
        }

        /* FALLING PETALS */
        .petal {
            position: fixed;

            top: -50px;

            z-index: 3;

            pointer-events: none;

            font-size: 20px;

            animation:
                fall linear infinite,
                sway ease-in-out infinite alternate;

            opacity: 0.9;
        }

        @keyframes fall {
            0% {
                top: -60px;
                transform: rotate(0deg);
            }

            100% {
                top: 110vh;
                transform: rotate(720deg);
            }
        }

        @keyframes sway {
            from {
                margin-left: -40px;
            }

            to {
                margin-left: 40px;
            }
        }

        /* FLOATING GOLD PARTICLES */
        .sparkle {
            position: fixed;

            z-index: 2;

            color: #dfba6b;

            font-size: 10px;

            pointer-events: none;

            animation: sparkleFloat 5s linear infinite;

            opacity: 0;
        }

        @keyframes sparkleFloat {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }

            20% {
                opacity: 0.7;
            }

            80% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-20vh) scale(1.2);
                opacity: 0;
            }
        }

        /* MUSIC CONTROLS */
        #musicControls {
            position: fixed;

            bottom: 25px;
            left: 25px;

            z-index: 10;

            display: flex;
            gap: 10px;
        }

        .music-btn {
            padding: 12px 18px;

            border: 1px solid #dfba6b;
            border-radius: 30px;

            background: rgba(25, 5, 12, 0.75);

            color: #dfba6b;

            font-family: Georgia, serif;

            cursor: pointer;

            backdrop-filter: blur(8px);

            transition: 0.3s;
        }

        .music-btn:hover {
            background: rgba(223,186,107,0.15);

            box-shadow:
                0 0 20px rgba(223,186,107,0.25);
        }

        /* MOBILE */
        @media (max-width: 650px) {

            .clock-container {
                padding: 35px 15px;
            }

            #clock {
                display: grid;

                grid-template-columns: repeat(2, 1fr);

                gap: 5px;
            }

            .time-box {
                border-left: none;
            }

            .number {
                font-size: 30px;
            }

            .label {
                font-size: 11px;
            }

            .message {
                margin-top: 25px;
            }

            #musicControls {
                bottom: 15px;
                left: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- 🎵 BACKGROUND MUSIC -->
    <audio id="weddingMusic"></audio>


    <!-- 🌹 FALLING PETALS -->
    <div class="petal" style="left:5%; animation-duration:9s,3s;">🌹</div>
    <div class="petal" style="left:12%; animation-duration:12s,4s; animation-delay:2s;">🌸</div>
    <div class="petal" style="left:20%; animation-duration:10s,3s; animation-delay:5s;">🌹</div>
    <div class="petal" style="left:28%; animation-duration:14s,4s; animation-delay:1s;">🌺</div>
    <div class="petal" style="left:37%; animation-duration:11s,3s; animation-delay:4s;">🌸</div>
    <div class="petal" style="left:46%; animation-duration:13s,4s; animation-delay:3s;">🌹</div>
    <div class="petal" style="left:55%; animation-duration:10s,3s; animation-delay:6s;">🌸</div>
    <div class="petal" style="left:64%; animation-duration:15s,4s; animation-delay:2s;">🌹</div>
    <div class="petal" style="left:73%; animation-duration:11s,3s; animation-delay:5s;">🌺</div>
    <div class="petal" style="left:82%; animation-duration:13s,4s; animation-delay:1s;">🌸</div>
    <div class="petal" style="left:90%; animation-duration:10s,3s; animation-delay:4s;">🌹</div>

    <!-- ✨ GOLDEN PARTICLES -->
    <div class="sparkle" style="left:8%; animation-delay:1s;">✦</div>
    <div class="sparkle" style="left:18%; animation-delay:3s;">✧</div>
    <div class="sparkle" style="left:31%; animation-delay:5s;">✦</div>
    <div class="sparkle" style="left:44%; animation-delay:2s;">✧</div>
    <div class="sparkle" style="left:58%; animation-delay:4s;">✦</div>
    <div class="sparkle" style="left:70%; animation-delay:1s;">✧</div>
    <div class="sparkle" style="left:84%; animation-delay:3s;">✦</div>


    <!-- 💍 MAIN CLOCK -->
    <div class="clock-container" id="mainClock">

        <div class="decoration">
            ♡ ✦ ♡
        </div>

        <h1>
            💍 Happily Ever After 💍
        </h1>

        <div class="sub-title">
            Time passed since July 17, 2026 · 5:00 PM
        </div>

        <div class="divider">
            <span></span>
            <div class="heart">♡</div>
            <span></span>
        </div>


        <!-- LIVE COUNTER -->
        <div id="clock">

            <div class="time-box">
                <span class="number" id="days">0</span>
                <span class="label">Days</span>
            </div>

            <div class="time-box">
                <span class="number" id="hours">0</span>
                <span class="label">Hours</span>
            </div>

            <div class="time-box">
                <span class="number" id="minutes">0</span>
                <span class="label">Minutes</span>
            </div>

            <div class="time-box">
                <span class="number" id="seconds">0</span>
                <span class="label">Seconds</span>
            </div>

        </div>


        <div class="divider">
            <span></span>
            <div class="heart">♥</div>
            <span></span>
        </div>


        <div class="message">
            Every second counts... ✨
        </div>

    </div>


    <!-- 🎵 MUSIC CONTROL BAR -->
    <div id="musicControls">
        <button id="prevButton" class="music-btn">⏮</button>
        <button id="musicButton" class="music-btn">🎵 Play Music</button>
        <button id="nextButton" class="music-btn">⏭</button>
    </div>


    <script>

        /* 🔐 PASSWORD */
        const SECRET_PASSWORD = "goldenbrown#12#11#17";


        /* 🔑 PASSWORD ACCESS */
        const userAccess = prompt(
            "Please enter the secret password to view the clock:"
        );


        if (userAccess === SECRET_PASSWORD) {

            /* SHOW CLOCK */
            document.getElementById("mainClock").style.display = "block";


            /*
             * 🕔 START DATE
             *
             * July 17, 2026
             * 5:00 PM
             *
             * IST = UTC + 5:30
             */
            const startDate =
                new Date("2026-07-17T17:00:00+05:30").getTime();


            /* ⏱️ LIVE COUNTER */
            function updateClock() {

                const now = Date.now();

                const difference = now - startDate;


                /* If the clock hasn't started */
                if (difference < 0) {

                    document.getElementById("days").textContent = "0";
                    document.getElementById("hours").textContent = "0";
                    document.getElementById("minutes").textContent = "0";
                    document.getElementById("seconds").textContent = "0";

                    return;
                }


                const days =
                    Math.floor(
                        difference / (1000 * 60 * 60 * 24)
                    );


                const hours =
                    Math.floor(
                        (difference % (1000 * 60 * 60 * 24))
                        / (1000 * 60 * 60)
                    );


                const minutes =
                    Math.floor(
                        (difference % (1000 * 60 * 60))
                        / (1000 * 60)
                    );


                const seconds =
                    Math.floor(
                        (difference % (1000 * 60))
                        / 1000
                    );


                document.getElementById("days").textContent = days;

                document.getElementById("hours").textContent =
                    String(hours).padStart(2, "0");

                document.getElementById("minutes").textContent =
                    String(minutes).padStart(2, "0");

                document.getElementById("seconds").textContent =
                    String(seconds).padStart(2, "0");
            }


            updateClock();

            setInterval(updateClock, 1000);


            /* 🎵 MULTI-SONG PLAYLIST WITH CONTROLS */
            const audio =
                document.getElementById("weddingMusic");

            const musicButton =
                document.getElementById("musicButton");

            const prevButton =
                document.getElementById("prevButton");

            const nextButton =
                document.getElementById("nextButton");

            /*
             * Track order:
             * 1. golden-brown.mp3.mp3 (Kannala Kannala)
             * 2. Alaakaa-Loova.mp3
             * 3. inayae.mp3
             * 4. Paththavaikkum.mp3
             * 5. bae.mp3
             * 6. enna.mp3
             */
            const playlist = [
                "golden-brown.mp3.mp3",
                "Alaakaa-Loova.mp3",
                "inayae.mp3",
                "Paththavaikkum.mp3",
                "bae.mp3",
                "enna.mp3"
            ];

            let currentTrackIndex = 0;

            function loadTrack(index) {
                audio.src = playlist[index];
                audio.load();
            }

            function playTrack() {
                audio.play()
                    .then(() => {
                        musicButton.textContent = "⏸ Pause Music";
                    })
                    .catch(error => {
                        console.log(error);
                    });
            }

            // Initial track load
            loadTrack(currentTrackIndex);

            // Next Track Button
            nextButton.addEventListener("click", () => {
                currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
                loadTrack(currentTrackIndex);
                playTrack();
            });

            // Previous Track Button
            prevButton.addEventListener("click", () => {
                currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
                loadTrack(currentTrackIndex);
                playTrack();
            });

            // Automatically play next song when current one finishes
            audio.addEventListener("ended", () => {
                currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
                loadTrack(currentTrackIndex);
                playTrack();
            });

            // Toggle Play/Pause button
            musicButton.addEventListener("click", () => {

                if (audio.paused) {
                    playTrack();
                } else {
                    audio.pause();
                    musicButton.textContent = "🎵 Play Music";
                }

            });


            /*
             * Try autoplay.
             * Modern browsers may block this until
             * the user interacts with the page.
             */
            audio.play()
                .then(() => {
                    musicButton.textContent =
                        "⏸ Pause Music";
                })
                .catch(() => {
                    console.log(
                        "Autoplay blocked. Use the music button."
                    );
                });


        } else {

            alert(
                "Incorrect password. Access denied."
            );

            document.body.innerHTML = `
                <div style="
                    color:#dfba6b;
                    font-family:Georgia,serif;
                    text-align:center;
                    width:100%;
                    padding:40px;
                ">
                    <h2>🔒 Access Denied</h2>
                    <p>Incorrect password.</p>
                </div>
            `;
        }

    </script>
</body>
</html>
